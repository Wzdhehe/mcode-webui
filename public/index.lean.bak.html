<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mcode WebUI</title>
  <style>
    /* ============================================================
       Theme variables (borrowed from webui.html — light + dark)
       ============================================================ */
    :root[data-theme="light"] {
      --bg: #ffffff;
      --bg-elevated: #ffffff;
      --bg-sidebar: #f9fafb;
      --bg-hover: #f3f4f6;
      --bg-input: #ffffff;
      --text: #1f2937;
      --text-secondary: #6b7280;
      --text-tertiary: #9ca3af;
      --border: #e5e7eb;
      --border-light: #f3f4f6;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-bg: #dbeafe;
      --accent-text: #1d4ed8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 10px 30px rgba(0,0,0,0.12);
      --user-accent: #3b82f6;
    }
    :root[data-theme="dark"] {
      --bg: #0f1115;
      --bg-elevated: #1a1d23;
      --bg-sidebar: #13161b;
      --bg-hover: #1f2329;
      --bg-input: #1a1d23;
      --text: #e5e7eb;
      --text-secondary: #9ca3af;
      --text-tertiary: #6b7280;
      --border: #2a2f36;
      --border-light: #1f2329;
      --accent: #60a5fa;
      --accent-hover: #3b82f6;
      --accent-bg: #1e3a8a;
      --accent-text: #93c5fd;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow: 0 4px 12px rgba(0,0,0,0.4);
      --shadow-lg: 0 10px 30px rgba(0,0,0,0.5);
      --user-accent: #60a5fa;
    }

    /* ============================================================
       Reset
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
        "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 0.2s, color 0.2s;
    }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; text-align: left; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    input, textarea { font: inherit; color: inherit; }
    input:focus, textarea:focus { outline: none; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }
    [hidden] { display: none !important; }

    /* ============================================================
       App layout
       ============================================================ */
    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
      position: relative;
    }
    .topbar {
      height: 44px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      z-index: 10;
    }
    .topbar-brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
    .topbar-logo {
      width: 24px; height: 24px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 6px;
      display: grid; place-items: center;
      color: white; font-weight: 700; font-size: 12px;
      letter-spacing: -0.5px;
    }
    .topbar-version {
      font-size: 11px; color: var(--text-tertiary);
      background: var(--bg-sidebar); padding: 2px 6px; border-radius: 4px;
    }
    .topbar-meta { font-size: 12px; color: var(--text-secondary); margin-left: 8px; }
    .topbar-spacer { flex: 1; }
    .topbar-status {
      font-size: 12px; color: var(--text-secondary);
      display: flex; align-items: center; gap: 6px;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-tertiary);
    }
    .status-dot.running { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
    .status-dot.ok { background: var(--success); }
    .status-dot.err { background: var(--danger); }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ============================================================
       Chat area
       ============================================================ */
    .main {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 24px;
    }
    .chat-inner {
      max-width: 820px; margin: 0 auto; width: 100%;
      display: flex; flex-direction: column;
      gap: 16px;
    }
    .chat-empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      margin-top: 20vh;
    }
    .chat-empty-logo {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: -3px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 24px;
      line-height: 1;
    }
    .chat-empty-subtitle {
      font-size: 16px; color: var(--text-secondary);
      margin-bottom: 24px;
    }
    .chat-empty-hints {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; max-width: 600px;
    }
    .chat-empty-hint {
      padding: 8px 14px; border-radius: 8px;
      background: var(--bg-hover); color: var(--text-secondary);
      font-size: 13px; cursor: pointer;
      transition: background 0.15s;
    }
    .chat-empty-hint:hover { background: var(--bg-active); color: var(--text); }

    /* ============================================================
       Message bubble
       ============================================================ */
    .msg {
      display: flex;
      gap: 12px;
      padding: 12px 0;
    }
    .msg.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: grid; place-items: center;
      color: white; font-weight: 600; font-size: 14px;
      flex-shrink: 0;
    }
    .msg.user .msg-avatar { background: linear-gradient(135deg, var(--user-accent), #8b5cf6); }
    .msg.assistant .msg-avatar { background: linear-gradient(135deg, #3b82f6, #8b5cf6); }
    .msg-body {
      flex: 1; min-width: 0;
      max-width: calc(100% - 44px);
    }
    .msg.user .msg-body { display: flex; justify-content: flex-end; }
    .msg-meta {
      font-size: 12px; color: var(--text-tertiary);
      margin-bottom: 4px;
      display: flex; gap: 8px; align-items: center;
    }
    .msg.user .msg-meta { justify-content: flex-end; }
    .msg-bubble {
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg.user .msg-bubble {
      background: var(--accent-bg);
      color: var(--accent-text);
      max-width: 80%;
    }
    .msg.assistant .msg-bubble {
      background: var(--bg-sidebar);
      color: var(--text);
    }
    .msg-thinking {
      margin: 8px 0;
      padding: 8px 12px;
      background: var(--bg-hover);
      border-left: 2px solid var(--text-tertiary);
      color: var(--text-secondary);
      font-size: 13px;
      font-style: italic;
      border-radius: 0 6px 6px 0;
      cursor: pointer;
      white-space: pre-wrap;
    }
    .msg-thinking.collapsed { color: var(--text-tertiary); }
    .msg-thinking.collapsed .thinking-content { display: none; }
    .msg-thinking::before {
      content: "💭 思考";
      font-style: normal; font-weight: 600; margin-right: 6px;
    }
    .msg-thinking.collapsed::before { content: "💭 思考(点击展开)"; }
    .msg-meta-tokens { color: var(--text-tertiary); font-size: 11px; }

    /* ============================================================
       Input bar
       ============================================================ */
    .input-bar {
      border-top: 1px solid var(--border);
      background: var(--bg-elevated);
      padding: 12px 16px;
    }
    .input-inner {
      max-width: 820px; margin: 0 auto;
      display: flex; flex-direction: column; gap: 8px;
    }
    .input-row {
      display: flex; gap: 8px; align-items: flex-end;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      transition: border-color 0.15s;
    }
    .input-row:focus-within { border-color: var(--accent); }
    textarea#prompt {
      flex: 1;
      border: none; background: transparent;
      padding: 8px; min-height: 24px; max-height: 200px;
      resize: none; font-size: 14px; line-height: 1.5;
    }
    .send-btn {
      width: 36px; height: 36px;
      display: grid; place-items: center;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      transition: background 0.15s, opacity 0.15s;
    }
    .send-btn:hover:not(:disabled) { background: var(--accent-hover); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .input-hints {
      display: flex; gap: 8px; align-items: center;
      padding: 0 8px;
      font-size: 12px; color: var(--text-tertiary);
    }
    .input-hints .spacer { flex: 1; }

    /* ============================================================
       Usage card (bottom-right, fixed)
       ============================================================ */
    .usage-card {
      position: fixed;
      bottom: 96px;
      right: 20px;
      width: 240px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      box-shadow: var(--shadow-lg);
      z-index: 5;
    }
    .usage-card h3 {
      font-size: 11px; color: var(--text-tertiary);
      margin-bottom: 8px; font-weight: 500;
      letter-spacing: 0.5px; text-transform: uppercase;
    }
    .usage-row {
      display: flex; justify-content: space-between;
      padding: 3px 0;
    }
    .usage-row .label { color: var(--text-secondary); }
    .usage-row .value { color: var(--text); font-variant-numeric: tabular-nums; }
    .usage-row.turn-tally .value { color: var(--accent); }
    .usage-divider { height: 1px; background: var(--border-light); margin: 8px 0; }
    .usage-empty { color: var(--text-tertiary); font-style: italic; }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-brand">
        <div class="topbar-logo">M</div>
        <span>mcode WebUI</span>
        <span class="topbar-version" id="versionTag">v0.1.2</span>
      </div>
      <span class="topbar-meta" id="modelDisplay">model: …</span>
      <span class="topbar-spacer"></span>
      <div class="topbar-status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusLabel">idle</span>
      </div>
    </header>

    <main class="main" id="main">
      <div class="chat-inner" id="chatInner">
        <div class="chat-empty" id="chatEmpty">
          <div class="chat-empty-logo">MCODE</div>
          <div class="chat-empty-subtitle">还没消息 — 在下方输入开始对话</div>
          <div class="chat-empty-hints" id="emptyHints">
            <div class="chat-empty-hint" data-prompt="一句话介绍你自己">一句话介绍你自己</div>
            <div class="chat-empty-hint" data-prompt="用三句话描述你的主要能力">用三句话描述你的主要能力</div>
            <div class="chat-empty-hint" data-prompt="我应该怎么向你提问最有效?">我应该怎么向你提问最有效?</div>
            <div class="chat-empty-hint" data-prompt="给我讲个冷笑话">给我讲个冷笑话</div>
          </div>
        </div>
      </div>
    </main>

    <div class="input-bar">
      <div class="input-inner">
        <div class="input-row">
          <textarea id="prompt" placeholder="输入消息... (Shift+Enter 换行, Enter 发送)" rows="1"></textarea>
          <button class="send-btn" id="sendBtn" title="发送 (Enter)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"/>
              <polyline points="5 12 12 5 19 12"/>
            </svg>
          </button>
        </div>
        <div class="input-hints">
          <span>每次请求 = 一个 mcode exec subprocess(无持久会话)</span>
          <span class="spacer"></span>
          <span id="lastTurnTokens"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="usage-card" id="usageCard">
    <h3>本页面用量</h3>
    <div id="usageBody" class="usage-empty">发送一条消息后开始累计</div>
  </div>

  <script>
    // ============================================================
    // State
    // ============================================================
    const $ = (id) => document.getElementById(id)
    const chatInner = $('chatInner')
    const emptyEl = $('chatEmpty')
    const promptEl = $('prompt')
    const sendBtn = $('sendBtn')
    const statusDot = $('statusDot')
    const statusLabel = $('statusLabel')
    const usageBody = $('usageBody')
    const lastTurnTokensEl = $('lastTurnTokens')
    const modelDisplay = $('modelDisplay')
    const versionTag = $('versionTag')

    let inFlight = false
    let currentAssistantEl = null
    let currentThinking = ''
    let currentContent = ''
    let lastDurationMs = null
    // session-aggregated usage (sums across all turns on this page)
    const totalUsage = { in: 0, out: 0, cache: 0, requests: 0, _seenIds: new Set() }

    // ============================================================
    // Theme (auto by prefers-color-scheme, persisted to localStorage)
    // ============================================================
    const savedTheme = localStorage.getItem('webui-theme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    document.documentElement.setAttribute('data-theme', savedTheme)

    // ============================================================
    // Helpers
    // ============================================================
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]))
    }
    function fmt(n) {
      if (n == null) return '—'
      if (n >= 1000000) return (n / 1000000).toFixed(2) + 'M'
      if (n >= 1000) return (n / 1000).toFixed(1) + 'k'
      return String(n)
    }
    function setStatus(text, kind) {
      statusLabel.textContent = text
      statusDot.className = 'status-dot' + (kind ? ' ' + kind : '')
    }
    function autoResize() {
      promptEl.style.height = 'auto'
      promptEl.style.height = Math.min(200, promptEl.scrollHeight) + 'px'
    }

    // ============================================================
    // Render
    // ============================================================
    function renderUsage() {
      if (totalUsage.requests === 0) {
        usageBody.className = 'usage-empty'
        usageBody.textContent = '发送一条消息后开始累计'
        return
      }
      usageBody.className = ''
      const total = totalUsage.in + totalUsage.out
      const dur = lastDurationMs ? `${lastDurationMs}ms` : '—'
      usageBody.innerHTML = `
        <div class="usage-row turn-tally"><span class="label">turns</span><span class="value">${totalUsage.requests}</span></div>
        <div class="usage-row"><span class="label">input</span><span class="value">${fmt(totalUsage.in)}</span></div>
        <div class="usage-row"><span class="label">output</span><span class="value">${fmt(totalUsage.out)}</span></div>
        ${totalUsage.cache ? `<div class="usage-row"><span class="label">cache read</span><span class="value">${fmt(totalUsage.cache)}</span></div>` : ''}
        <div class="usage-divider"></div>
        <div class="usage-row"><span class="label">total tokens</span><span class="value">${fmt(total)}</span></div>
        <div class="usage-row"><span class="label">last turn</span><span class="value">${dur}</span></div>
      `
    }

    function appendUserBubble(text) {
      if (emptyEl) emptyEl.remove()
      const div = document.createElement('div')
      div.className = 'msg user'
      div.innerHTML = `
        <div class="msg-avatar">你</div>
        <div class="msg-body">
          <div class="msg-meta">你</div>
          <div class="msg-bubble">${escapeHtml(text)}</div>
        </div>
      `
      chatInner.appendChild(div)
      chatInner.scrollTop = chatInner.scrollHeight
    }
    function startAssistantBubble() {
      if (emptyEl) emptyEl.remove()
      const div = document.createElement('div')
      div.className = 'msg assistant'
      div.innerHTML = `
        <div class="msg-avatar">M</div>
        <div class="msg-body">
          <div class="msg-meta">
            <span>mcode</span>
            <span class="msg-thinking collapsed"><span class="thinking-content"></span></span>
          </div>
          <div class="msg-bubble"></div>
        </div>
      `
      chatInner.appendChild(div)
      chatInner.scrollTop = chatInner.scrollHeight
      currentAssistantEl = div
      currentThinking = ''
      currentContent = ''
      div.querySelector('.msg-thinking').addEventListener('click', (e) => {
        e.currentTarget.classList.toggle('collapsed')
      })
    }

    function handleStreamMsg(msg) {
      if (!currentAssistantEl) return
      const thinkingEl = currentAssistantEl.querySelector('.msg-thinking')
      const thinkingContent = thinkingEl.querySelector('.thinking-content')
      const bubble = currentAssistantEl.querySelector('.msg-bubble')

      if (msg.type === 'delta') {
        if (typeof msg.thinking === 'string') {
          currentThinking += msg.thinking
          thinkingContent.textContent = currentThinking
          thinkingEl.classList.remove('collapsed')
        }
        if (typeof msg.content === 'string') {
          currentContent += msg.content
          bubble.textContent = currentContent
        }
        chatInner.scrollTop = chatInner.scrollHeight
      } else if (msg.type === 'message' && msg.message) {
        const m = msg.message
        if (typeof m.content === 'string') {
          currentContent = m.content
          bubble.textContent = currentContent
        }
        if (typeof m.thinking === 'string') {
          currentThinking = m.thinking
          thinkingContent.textContent = currentThinking
        }
        if (m.usage) {
          // accumulate immediately (don't wait for 'done' event)
          totalUsage.in += Number(m.usage.inputTokens) || 0
          totalUsage.out += Number(m.usage.outputTokens) || 0
          totalUsage.cache += Number(m.usage.cacheReadTokens) || 0
          if (m.id && !totalUsage._seenIds.has(m.id)) {
            totalUsage._seenIds.add(m.id)
            totalUsage.requests += 1
          }
          if (m.usage.requestDurationMs) lastDurationMs = m.usage.requestDurationMs
          lastTurnTokensEl.textContent =
            `in ${fmt(totalUsage.in)} · out ${fmt(totalUsage.out)} · ${m.usage.requestDurationMs ?? '?'}ms`
          renderUsage()
        }
        chatInner.scrollTop = chatInner.scrollHeight
      } else if (msg.type === 'session-status') {
        setStatus(`session: ${msg.status}`,
          msg.status === 'finished' ? 'ok' :
          msg.status === 'error' ? 'err' : 'running')
      } else if (msg.type === 'exec.result') {
        if (msg.answer) {
          currentContent = msg.answer
          bubble.textContent = currentContent
        }
        if (msg.status === 'failed') {
          setStatus('failed: ' + (msg.error?.message || ''), 'err')
          bubble.textContent = '⚠️ ' + (msg.error?.message || 'failed')
        } else if (msg.status === 'succeeded') {
          if (typeof msg.durationMs === 'number') {
            lastDurationMs = msg.durationMs
            renderUsage()
          }
          setStatus('done · ' + (msg.durationMs ?? '?') + 'ms', 'ok')
        }
      }
      // heartbeat / generic / done: ignore at this layer
    }

    // ============================================================
    // Send
    // ============================================================
    async function send() {
      const text = promptEl.value.trim()
      if (!text || inFlight) return
      inFlight = true
      sendBtn.disabled = true
      promptEl.value = ''
      autoResize()
      appendUserBubble(text)
      startAssistantBubble()
      setStatus('starting…', 'running')

      let res
      try {
        res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text }),
        })
      } catch (e) {
        setStatus('network error: ' + e.message, 'err')
        inFlight = false
        sendBtn.disabled = false
        return
      }
      if (!res.ok) {
        const t = await res.text()
        setStatus('http ' + res.status + ': ' + t, 'err')
        inFlight = false
        sendBtn.disabled = false
        return
      }
      const reader = res.body.getReader()
      const decoder = new TextDecoder()
      let buf = ''
      while (true) {
        const { value, done } = await reader.read()
        if (done) break
        buf += decoder.decode(value, { stream: true })
        let sep
        while ((sep = buf.indexOf('\n\n')) !== -1) {
          const block = buf.slice(0, sep)
          buf = buf.slice(sep + 2)
          handleSSE(block)
        }
      }
      inFlight = false
      sendBtn.disabled = false
      promptEl.focus()
    }

    function handleSSE(block) {
      let event = 'message'
      let data = ''
      for (const line of block.split('\n')) {
        if (line.startsWith('event:')) event = line.slice(6).trim()
        else if (line.startsWith('data:')) data += line.slice(5).trim()
      }
      if (!data) return
      let parsed
      try { parsed = JSON.parse(data) } catch { return }
      if (event === 'start') {
        setStatus('running…', 'running')
      } else if (event === 'stream') {
        handleStreamMsg(parsed)
      } else if (event === 'done') {
        if (parsed.usage && totalUsage.requests === 0) {
          totalUsage.in += Number(parsed.usage.inputTokens) || 0
          totalUsage.out += Number(parsed.usage.outputTokens) || 0
          totalUsage.cache += Number(parsed.usage.cacheReadTokens) || 0
          totalUsage.requests += 1
          if (parsed.usage.requestDurationMs) lastDurationMs = parsed.usage.requestDurationMs
          renderUsage()
        } else if (typeof parsed.durationMs === 'number' && !lastDurationMs) {
          lastDurationMs = parsed.durationMs
          renderUsage()
        }
        if (parsed.code === 0) setStatus('done', 'ok')
        else setStatus('exit ' + parsed.code, parsed.code === 0 ? 'ok' : 'err')
      } else if (event === 'stderr') {
        console.warn('stderr:', parsed.chunk)
      } else if (event === 'error') {
        setStatus('error: ' + parsed.message, 'err')
      } else if (event === 'stdout') {
        console.log('raw stdout:', parsed.line)
      }
    }

    // ============================================================
    // Event bindings
    // ============================================================
    sendBtn.addEventListener('click', send)
    promptEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault()
        send()
      }
    })
    promptEl.addEventListener('input', autoResize)
    document.getElementById('emptyHints').addEventListener('click', (e) => {
      const hint = e.target.closest('.chat-empty-hint')
      if (!hint) return
      promptEl.value = hint.dataset.prompt
      autoResize()
      promptEl.focus()
    })

    // ============================================================
    // Initial fetch: health → model + version
    // ============================================================
    fetch('/api/health')
      .then((r) => r.json())
      .then((j) => {
        if (j.defaultModel) modelDisplay.textContent = 'model: ' + j.defaultModel
        if (j.mcodeVersion) versionTag.textContent = 'v' + j.mcodeVersion
      })
      .catch(() => {
        modelDisplay.textContent = 'model: (server unreachable)'
      })
    promptEl.focus()
    renderUsage()
  </script>
</body>
</html>
