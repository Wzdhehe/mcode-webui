<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mcode WebUI</title>
  <style>
    :root {
      --bg: #0e0e10;
      --bg-elev: #18181b;
      --border: #27272a;
      --fg: #e4e4e7;
      --fg-mute: #a1a1aa;
      --accent: #3b82f6;
      --thinking: #71717a;
      --success: #22c55e;
      --error: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elev);
      flex-shrink: 0;
    }
    .topbar .logo { font-weight: 600; color: var(--accent); font-size: 16px; }
    .topbar .meta { color: var(--fg-mute); font-size: 12px; }
    .topbar .spacer { flex: 1; }
    .main {
      flex: 1; overflow-y: auto;
      padding: 24px;
      max-width: 820px; margin: 0 auto; width: 100%;
    }
    .input-bar {
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      background: var(--bg-elev);
      flex-shrink: 0;
    }
    textarea {
      width: 100%; min-height: 60px; max-height: 200px;
      padding: 12px;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 8px;
      resize: vertical;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    .toolbar { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
    .toolbar .spacer { flex: 1; }
    .toolbar .small { color: var(--fg-mute); font-size: 12px; }
    button {
      padding: 8px 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-bottom: 16px; padding: 12px 16px; border-radius: 8px; }
    .msg.user { background: var(--bg-elev); }
    .msg.assistant { background: transparent; }
    .msg-role { font-size: 12px; color: var(--fg-mute); margin-bottom: 6px; }
    .msg-content { line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .thinking {
      margin: 8px 0;
      padding: 8px 12px;
      background: rgba(113,113,122,0.12);
      border-left: 2px solid var(--thinking);
      color: var(--thinking);
      font-size: 13px;
      font-style: italic;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
    }
    .thinking.collapsed .thinking-content { display: none; }
    .thinking::before {
      content: "💭 思考中... ";
      font-style: normal;
      font-weight: 600;
    }
    .thinking.collapsed::before { content: "💭 思考(点击展开)"; }
    .empty { text-align: center; color: var(--fg-mute); margin-top: 30vh; }
    .empty h1 { color: var(--accent); margin-bottom: 12px; font-size: 28px; }
    .empty p { margin-bottom: 4px; }
    .empty .hint { font-size: 12px; margin-top: 12px; opacity: 0.7; }
    .status-pill {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .usage-card {
      position: fixed;
      bottom: 96px;
      right: 20px;
      width: 220px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .usage-card h3 {
      font-size: 12px;
      color: var(--fg-mute);
      margin-bottom: 8px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .usage-row {
      display: flex; justify-content: space-between;
      padding: 3px 0;
    }
    .usage-row .label { color: var(--fg-mute); }
    .usage-row .value { color: var(--fg); font-variant-numeric: tabular-nums; }
    .usage-divider { height: 1px; background: var(--border); margin: 8px 0; }
    .usage-empty { color: var(--fg-mute); font-style: italic; }
    .turn-tally { color: var(--accent); }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo">mcode webui</div>
    <div class="meta" id="modelDisplay">model: loading...</div>
    <div class="spacer"></div>
    <span class="status-pill" id="statusDisplay">idle</span>
  </div>
  <div class="main" id="main">
    <div class="empty" id="empty">
      <h1>👋 mcode webui</h1>
      <p>在下方输入消息开始对话</p>
      <p class="hint">由 mcode exec --output-format stream-json 驱动</p>
      <p class="hint" id="workspaceHint"></p>
    </div>
  </div>
  <div class="input-bar">
    <textarea id="promptInput" placeholder="输入消息... (Shift+Enter 换行, Enter 发送)"></textarea>
    <div class="toolbar">
      <span class="small">每次请求 = 一个 mcode exec subprocess(无持久会话)</span>
      <span class="spacer"></span>
      <span class="small" id="tokenDisplay"></span>
      <button id="sendBtn">发送</button>
    </div>
  </div>

  <div class="usage-card" id="usageCard">
    <h3>本页面用量</h3>
    <div id="usageBody" class="usage-empty">发送一条消息后开始累计</div>
  </div>
  <script>
    const $ = id => document.getElementById(id)
    const main = $('main')
    const input = $('promptInput')
    const sendBtn = $('sendBtn')
    const status = $('statusDisplay')
    const modelDisplay = $('modelDisplay')
    const workspaceHint = $('workspaceHint')
    const usageBody = $('usageBody')

    let currentAssistant = null
    let currentThinking = ''
    let currentContent = ''
    let inFlight = 0
    // session-aggregated usage (sums across all turns on this page)
    let totalUsage = { in: 0, out: 0, cache: 0, requests: 0 }
    let lastDurationMs = null

    fetch('/api/health')
      .then(r => r.json())
      .then(j => {
        modelDisplay.textContent = 'model: ' + j.defaultModel
        workspaceHint.textContent = 'workspace: ' + j.defaultWorkspace
      })
      .catch(() => {
        modelDisplay.textContent = 'model: (server unreachable)'
      })

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]))
    }

    function setStatus(text, kind) {
      status.textContent = text
      status.style.color = ''
      status.style.borderColor = ''
      if (kind === 'running') status.style.color = 'var(--accent)'
      else if (kind === 'ok') status.style.color = 'var(--success)'
      else if (kind === 'err') status.style.color = 'var(--error)'
    }

    function appendUserMsg(text) {
      const empty = main.querySelector('.empty')
      if (empty) empty.remove()
      const div = document.createElement('div')
      div.className = 'msg user'
      div.innerHTML = `<div class="msg-role">你</div><div class="msg-content">${escapeHtml(text)}</div>`
      main.appendChild(div)
      main.scrollTop = main.scrollHeight
    }

    function startAssistantMsg() {
      const div = document.createElement('div')
      div.className = 'msg assistant'
      div.innerHTML = `<div class="msg-role">assistant</div>
        <div class="thinking collapsed"><div class="thinking-content"></div></div>
        <div class="msg-content"></div>`
      main.appendChild(div)
      main.scrollTop = main.scrollHeight
      currentAssistant = div
      currentThinking = ''
      currentContent = ''
      // clicking thinking toggles collapse
      div.querySelector('.thinking').addEventListener('click', (e) => {
        e.currentTarget.classList.toggle('collapsed')
      })
    }

    async function send() {
      const prompt = input.value.trim()
      if (!prompt || inFlight > 0) return
      inFlight = 1
      sendBtn.disabled = true
      input.value = ''
      appendUserMsg(prompt)
      startAssistantMsg()
      setStatus('starting...', 'running')

      let res
      try {
        res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }),
        })
      } catch (e) {
        setStatus('network error: ' + e.message, 'err')
        inFlight = 0
        sendBtn.disabled = false
        return
      }

      if (!res.ok) {
        const txt = await res.text()
        setStatus('http ' + res.status + ': ' + txt, 'err')
        inFlight = 0
        sendBtn.disabled = false
        return
      }

      const reader = res.body.getReader()
      const decoder = new TextDecoder()
      let buf = ''
      while (true) {
        const { value, done } = await reader.read()
        if (done) break
        buf += decoder.decode(value, { stream: true })
        let sep
        while ((sep = buf.indexOf('\n\n')) !== -1) {
          const block = buf.slice(0, sep)
          buf = buf.slice(sep + 2)
          handleSSE(block)
        }
      }

      inFlight = 0
      sendBtn.disabled = false
      input.focus()
    }

    function handleSSE(block) {
      const lines = block.split('\n')
      let event = 'message'
      let data = ''
      for (const line of lines) {
        if (line.startsWith('event:')) event = line.slice(6).trim()
        else if (line.startsWith('data:')) data += line.slice(5).trim()
      }
      if (!data) return
      let parsed
      try { parsed = JSON.parse(data) } catch (e) { return }
      if (event === 'start') {
        setStatus('running...', 'running')
      } else if (event === 'stream') {
        handleStreamMsg(parsed)
      } else if (event === 'done') {
        // usage is already accumulated from the 'message' stream event (which has msg.usage)
        // — only fall back to done.usage for streams that didn't deliver a message event
        if (parsed.usage && totalUsage.requests === 0) {
          totalUsage.in += Number(parsed.usage.inputTokens) || 0
          totalUsage.out += Number(parsed.usage.outputTokens) || 0
          totalUsage.cache += Number(parsed.usage.cacheReadTokens) || 0
          totalUsage.requests += 1
          if (parsed.usage.requestDurationMs) lastDurationMs = parsed.usage.requestDurationMs
          renderUsage()
        } else if (typeof parsed.durationMs === 'number' && !lastDurationMs) {
          lastDurationMs = parsed.durationMs
          renderUsage()
        }
        if (parsed.code === 0) setStatus('done', 'ok')
        else setStatus('exit ' + parsed.code, parsed.code === 0 ? 'ok' : 'err')
      } else if (event === 'stderr') {
        console.warn('stderr:', parsed.chunk)
      } else if (event === 'error') {
        setStatus('error: ' + parsed.message, 'err')
      } else if (event === 'stdout') {
        console.log('raw stdout:', parsed.line)
      }
    }

    function handleStreamMsg(msg) {
      if (!currentAssistant) return
      const thinkingEl = currentAssistant.querySelector('.thinking')
      const thinkingContent = thinkingEl.querySelector('.thinking-content')
      const msgContent = currentAssistant.querySelector('.msg-content')

      if (msg.type === 'delta') {
        if (typeof msg.thinking === 'string') {
          currentThinking += msg.thinking
          thinkingContent.textContent = currentThinking
          thinkingEl.classList.remove('collapsed')
        }
        if (typeof msg.content === 'string') {
          currentContent += msg.content
          msgContent.textContent = currentContent
        }
        main.scrollTop = main.scrollHeight
      } else if (msg.type === 'message' && msg.message) {
        const m = msg.message
        if (typeof m.content === 'string') {
          currentContent = m.content
          msgContent.textContent = currentContent
        }
        if (typeof m.thinking === 'string') {
          currentThinking = m.thinking
          thinkingContent.textContent = currentThinking
        }
        if (m.usage) {
          $('tokenDisplay').textContent =
            `in ${m.usage.inputTokens ?? '-'} · out ${m.usage.outputTokens ?? '-'} · ${m.usage.requestDurationMs ?? '-'}ms`
          // also accumulate into the page-level usage card RIGHT NOW (don't wait for 'done' event)
          totalUsage.in += Number(m.usage.inputTokens) || 0
          totalUsage.out += Number(m.usage.outputTokens) || 0
          totalUsage.cache += Number(m.usage.cacheReadTokens) || 0
          // only count this turn once — use the messageId as dedup key
          if (m.id && !totalUsage._seenIds) totalUsage._seenIds = new Set()
          if (m.id && !totalUsage._seenIds.has(m.id)) {
            totalUsage._seenIds.add(m.id)
            totalUsage.requests += 1
          }
          if (m.usage.requestDurationMs) lastDurationMs = m.usage.requestDurationMs
          renderUsage()
        }
        main.scrollTop = main.scrollHeight
      } else if (msg.type === 'exec.result' && msg.status === 'succeeded') {
        // exec.result arrives AFTER the 'done' event from mcode, so update duration here if we still don't have it
        if (typeof msg.durationMs === 'number' && !lastDurationMs) {
          lastDurationMs = msg.durationMs
          renderUsage()
        }
      } else if (msg.type === 'session-status') {
        setStatus(`session: ${msg.status}`,
          msg.status === 'finished' ? 'ok' :
          msg.status === 'error' ? 'err' : 'running')
      } else if (msg.type === 'exec.result') {
        if (msg.answer) {
          currentContent = msg.answer
          msgContent.textContent = currentContent
        }
        if (msg.status === 'failed') {
          setStatus('failed: ' + (msg.error?.message || ''), 'err')
          msgContent.textContent = '⚠️ ' + (msg.error?.message || 'failed')
        } else if (msg.status === 'succeeded') {
          setStatus('done · ' + (msg.durationMs ?? '?') + 'ms', 'ok')
        }
      }
      // heartbeat / generic / done: ignored at this layer
    }

    function fmt(n) {
      if (n == null) return '—'
      if (n >= 1000000) return (n / 1000000).toFixed(2) + 'M'
      if (n >= 1000) return (n / 1000).toFixed(1) + 'k'
      return String(n)
    }
    function renderUsage() {
      if (totalUsage.requests === 0) {
        usageBody.className = 'usage-empty'
        usageBody.textContent = '发送一条消息后开始累计'
        return
      }
      usageBody.className = ''
      const total = totalUsage.in + totalUsage.out
      const dur = lastDurationMs ? ` · ${lastDurationMs}ms` : ''
      usageBody.innerHTML = `
        <div class="usage-row"><span class="label">turns</span><span class="value turn-tally">${totalUsage.requests}</span></div>
        <div class="usage-row"><span class="label">input</span><span class="value">${fmt(totalUsage.in)}</span></div>
        <div class="usage-row"><span class="label">output</span><span class="value">${fmt(totalUsage.out)}</span></div>
        ${totalUsage.cache ? `<div class="usage-row"><span class="label">cache read</span><span class="value">${fmt(totalUsage.cache)}</span></div>` : ''}
        <div class="usage-divider"></div>
        <div class="usage-row"><span class="label">total tokens</span><span class="value">${fmt(total)}</span></div>
        <div class="usage-row"><span class="label">last turn</span><span class="value">${dur || '—'}</span></div>
      `
    }
    renderUsage()

    sendBtn.addEventListener('click', send)
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault()
        send()
      }
    })
    input.focus()
  </script>
</body>
</html>
